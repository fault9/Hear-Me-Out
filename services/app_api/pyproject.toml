[project]
name = "hearmeout-app-api"
version = "0.1.0"
description = "Hear-Me-Out app-api: serves the frontend + REST (transcribe, offline Seed-VC, metrics)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.4.0",
    "torchaudio==2.4.0",
    # web
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.18",
    "starlette",
    "websockets",
    "werkzeug",
    "requests",  # study engine-manager → VC engine load-target / health
    "httpx",     # reverse-proxy the observability UI under /logs
    "pyyaml",    # study YAML template import/export
    # transcription + VAD
    "faster-whisper==1.2.1",
    "silero-vad",
    # huggingface
    "huggingface-hub>=0.34,<1.0",
    "hf-transfer>=0.1.8",
    # metrics.py (Metrics tab + voice-change modal)
    "pyphen",
    "librosa==0.10.2",
    # Pinned to torch-2.4-compatible transformers: newer releases import DTensor
    # from torch.distributed.tensor (needs torch>=2.5), crashing the metrics path.
    "transformers==4.44.1",
    "sentence-transformers==3.3.1",
    "matplotlib",
    "soundfile==0.12.1",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "safetensors>=0.5.3",
    # Seed-VC is invoked as a subprocess via sys.executable, so it shares this venv.
    # Core Seed-VC deps; reconcile with seed-vc/requirements.txt on first `uv lock`.
    "descript-audio-codec==1.0.0",
    "bigvgan",
    "munch==4.0.0",
    "omegaconf",
    "einops==0.7.0",
    "sounddevice==0.5.0",
    "sentencepiece==0.2.0",
    "accelerate",
    "gdown",
    "pydub==0.25.1",
    # Soundboard offline pitch/formant shift. Decouples F0 from spectral
    # envelope so we can shift each independently while preserving duration.
    "pyworld>=0.3.4",
    # Soundboard loudness normalization (EBU R128 / LUFS) so conditions match
    # in playback level. Pure numpy/scipy under the hood (both already pinned).
    "pyloudnorm>=0.1.1",
    # pyworld's __init__.py imports pkg_resources (from setuptools). Newer
    # uv-managed venvs don't ship setuptools by default, so pyworld errors on
    # import without this. Pinned as a direct dep so future syncs pick it up.
    "setuptools>=68",
    # LLM-assisted coding pipeline (study.coding judge/verifier). Only the
    # `judge` subcommand touches the API; everything else runs offline.
    "anthropic>=0.40",
    # Distributed tracing (OpenTelemetry) — optional; code is a no-op unless OTEL_* is set.
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-requests",
    "nvidia-ml-py",  # NVML GPU metrics (utilization/memory/temp/power) via OTel gauges
]

[project.optional-dependencies]
aesthetics = ["audiobox-aesthetics"]

# PyTorch CUDA 12.1 wheels (shared with meanvc/personaplex via uv's global cache).
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
