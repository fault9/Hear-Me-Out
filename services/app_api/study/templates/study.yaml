# Voice-conditioned grounding and repair study - importable protocol template.
#
# Source of participant-facing wording and scenario materials:
# appendix_promptsv4.tex, "System Prompts and Participant Scenario Cards" (2026-08-01).
#
# Before recruitment:
#   1. Confirm the participant-information and consent wording with the responsible researcher.
#   2. Upload both XVC targets with Speaker IDs matching the refs below.
#   3. Align the manuscript with the stable-converted playback protocol below.
#   4. Pilot every counterbalance cell and verify the admin balance report.
#
# Import replaces the study's scenarios, questionnaires, and settings.

name: Voice-Conditioned Grounding and Repair Study
description: >
  One stable-natural practice interaction followed by four counterbalanced analytical
  scenarios: stable natural, stable converted, VC activation, and VC deactivation.

targets:
  - ref: masculine_presenting
    engine: xvc
  - ref: feminine_presenting
    engine: xvc

# The four analytical scenarios use a Graeco-Latin arrangement. Across cb1-cb4:
#   - every analytical scenario occurs once in every ordinal position;
#   - every analytical scenario receives every voice condition once; and
#   - every voice condition occurs once in every analytical ordinal position.
# The practice scenario remains first and stable natural.
#
# Variants are allocated independently within each assignment stratum. The target
# rule follows the supervisor's current instruction and is not an independent
# target-voice counterbalance: Woman/Man map to the opposite-presenting target,
# while other or undisclosed responses use a balanced random fallback.
counterbalancing:
  target_assignment:
    questionnaire_kind: background
    answer_id: gender_identity
    target_by_answer:
      Woman: masculine_presenting
      Man: feminine_presenting
    # Responses without a prespecified opposite-presenting mapping are assigned
    # randomly among the currently least-used targets.
    fallback_targets: [masculine_presenting, feminine_presenting]

  conditions:
    practice:
      voice_schedule:
        - { mode: natural, start_s: 0, end_s: null }
    stable_natural:
      voice_schedule:
        - { mode: natural, start_s: 0, end_s: null }
    stable_converted:
      voice_schedule:
        - { mode: vc, engine: xvc, start_s: 0, end_s: null }
    vc_activation:
      voice_schedule:
        - { mode: natural, start_s: 0, end_s: 45 }
        - { mode: vc, engine: xvc, start_s: 45, end_s: null }
    vc_deactivation:
      voice_schedule:
        - { mode: vc, engine: xvc, start_s: 0, end_s: 45 }
        - { mode: natural, start_s: 45, end_s: null }

  variants:
    - id: cb1
      scenario_order: [1, 2, 3, 4, 5]
      condition_assignment:
        1: practice
        2: stable_natural
        3: vc_activation
        4: vc_deactivation
        5: stable_converted
    - id: cb2
      scenario_order: [1, 3, 2, 5, 4]
      condition_assignment:
        1: practice
        2: vc_deactivation
        3: stable_converted
        4: stable_natural
        5: vc_activation
    - id: cb3
      scenario_order: [1, 4, 5, 2, 3]
      condition_assignment:
        1: practice
        2: stable_converted
        3: vc_deactivation
        4: vc_activation
        5: stable_natural
    - id: cb4
      scenario_order: [1, 5, 4, 3, 2]
      condition_assignment:
        1: practice
        2: vc_activation
        3: stable_natural
        4: stable_converted
        5: vc_deactivation

settings:
  # Keep natural and converted conditions on one instrumented proxy path.
  study_engine: xvc
  # Frozen VCTK excerpts selected by the prespecified target-screening audit.
  # Upload these exact WAVs under the target refs declared above. Each VC
  # session also receives an immutable target.wav copy and SHA-256 record.
  target_manifest:
    masculine_presenting:
      corpus: VCTK
      speaker_id: p279
      source_file: male_english_leicester_p279_10s.wav
    feminine_presenting:
      corpus: VCTK
      speaker_id: p229
      source_file: female_southern_p229_10s.wav
  # Matched analysis boundary for every analytical condition. Switching routes
  # change state here; stable routes only record the checkpoint.
  analysis_checkpoint_s: 45
  # Frozen per session and applied by the post-hoc technical-validity report.
  # Playback underruns are logged but are not an automatic exclusion until the
  # technical pilot establishes a defensible threshold for between-turn gaps.
  technical_validity:
    max_route_activation_lag_ms: 250
    # Frozen from the technical pilot: all packets crossed browser-to-proxy,
    # while AudioContext sample-boundary discontinuities were <= 40 ms total
    # and <= 8 ms individually. Exceeding these limits flags timing for review;
    # it does not by itself exclude the session's condition or questionnaire data.
    max_capture_gap_total_ms: 50
    max_capture_gap_ms: 10
    # Amended 2026-08-11. The two budgets above gate automatic timing measures.
    # Manual verification is gated on the largest single gap alone: the aligned
    # WAV places every chunk at its own timeline stamp, so drops leave silence
    # in the right place rather than displacing what follows, and a listener
    # setting the boundary by ear absorbs what remains. Collected sessions lost
    # at most 32 ms of audio in any 500 ms window regardless of session total.
    max_manual_verification_gap_ms: 50
    invalid_end_reasons: [technical_problem, artifact_initialization_failed]
  timing:
    # Frozen from P02001 activation/deactivation OBS calibration. The browser's
    # input callback timeline lagged the independently recorded playback clock
    # by 354.84 and 367.96 ms; use their session-balanced mean.
    participant_capture_latency_correction_ms: 361.4
    clock_alignment_validation:
      status: passed
      pilot_id: P02001
      conditions: [vc_activation, vc_deactivation]
      between_session_relative_offset_range_ms: 13.12
      artifact: docs/study-artifacts/timing-validation/P02001_timing_validation.json
    speech_boundary_validation:
      status: confirmed_for_candidate_nomination
      pilot_id: P02001
      conditions: [vc_activation, vc_deactivation]
      frame_ms: 20
      minimum_overlap_ms: 200
      maximum_boundary_match_distance_ms: 250
      require_manual_event_verification: true
      artifact: docs/study-artifacts/timing-validation/P02001_timing_validation.json
      artifact_sha256: 600ec7bce4a9bfd84c8bcd4bd1ed79de7fc43f1f1179d4841d097de5acaa5805
  estimated_duration: ~30 minutes
  welcome_text: |
    Welcome

    Thank you for your interest in this study. The study examines spoken interaction with an AI
    assistant. If you take part, you will complete four short task-based conversations and answer
    questions about your experience. You will first complete one short practice conversation.

    Your speech will be recorded. Depending on the interaction, your transmitted speech may remain
    natural, be digitally voice-converted, or change between natural and converted speech. You will
    not hear the converted version of your voice during the live interactions. After the four
    interactions, you will hear two short excerpts of your converted speech.

    Participation is voluntary. The study is expected to take approximately 20-30 minutes.
  practice_intro_text: |
    You will now complete a short practice conversation to become familiar with the study tasks and
    controls.

    The practice recording is retained for technical checks but is not included in the main analysis.
    Read the scenario carefully, then continue when you are ready.
  main_intro_text: |
    The practice interaction is complete. You will now begin the four main study conversations.

    Each conversation presents a different situation and aim. Read each scenario carefully and speak
    naturally using your own words. Continue when you are ready to begin.

questionnaires:
  eligibility:
    - id: eligibility_18
      type: radio
      required: true
      label: "Are you 18 years old or older?"
      options: ["Yes", "No"]

  consent:
    - id: participant_information
      type: notice
      label: |
        ### Consent to participate

        **Project:** KTH Voice Study

        Please read the participant information before deciding whether to take part. By consenting,
        you confirm that:

        - You have received information about the study and have had the opportunity to ask questions.
          You may keep a copy of the written information.
        - You consent to participate in this project.
        - You consent to text transcriptions of your conversations being analyzed by "automated third-party processing tools."
        - You understand that your speech will be recorded and may be digitally voice-converted or
          change between natural and converted speech during an interaction. You will not hear the
          converted version live, but you will hear two short excerpts of your converted speech
          afterward.
        - All data will be stored on secure KTH servers.
        - All sensitive and 

        ### Your data rights

        Study data that forms the basis of the research results, including audio recordings and
        questionnaire responses, will be stored securely by KTH for at least 10 years after the project
        ends, in accordance with KTH's archiving rules. Access will be restricted to authorised people.

        Under EU data-protection rules and national supplementary legislation, you may have the right to:

        - withdraw your consent without affecting processing that took place before withdrawal
        - request access to or correction or deletion of your personal data
        - request that processing of your personal data be restricted

        These rights may be limited in some circumstances, including by confidentiality and archiving
        requirements.

        To exercise these rights, contact the researcher responsible for the project using the contact
        details in the participant information, or contact KTH's data protection officer at
        [dataskyddsombud@kth.se](mailto:dataskyddsombud@kth.se). You may also complain to the
        [Swedish Authority for Privacy Protection (IMY)](https://www.imy.se/).
    - id: consent_decision
      type: radio
      required: true
      label: |
        I have read and understood the participant information and the consent statements above. I
        understand that participation is voluntary and that I may stop participating without giving a
        reason.

        Do you consent to participate?
      options:
        - "I consent and wish to continue."
        - "I do not consent."

  background:
    - id: background_intro
      type: notice
      label: >
        The following questions are used to describe the study sample. You may select
        "Prefer not to answer" where that option is provided.
    - id: age
      type: radio
      required: true
      label: "What is your age range?"
      options: ["18-24", "25-34", "35-44", "45-54", "55-64", "65 or older", "Prefer not to answer"]
    - id: first_languages
      type: text
      label: "What language or languages did you first learn to speak?"
      placeholder: "Optional"
    - id: most_spoken_languages
      type: text
      label: "What language or languages do you currently speak most often?"
      placeholder: "Optional"
    - id: speak_english
      type: scale
      label: |
        How would you rate your ability to express yourself in English during a task-oriented spoken
        conversation? 4 = I could express most of the necessary information with some difficulty.
      min: 1
      max: 7
      min_label: "I would have great difficulty expressing the necessary information"
      max_label: "I could express the necessary information easily and precisely"
      extra_options: ["Prefer not to answer"]
    - id: understand_english
      type: scale
      label: |
        How would you rate your ability to understand English during a task-oriented spoken
        conversation? 4 = I could understand most of the conversation with some difficulty.
      min: 1
      max: 7
      min_label: "I would have great difficulty understanding the conversation"
      max_label: "I could understand the conversation easily and accurately"
      extra_options: ["Prefer not to answer"]
    - id: prior_generative_ai
      type: radio
      label: >
        During the past six months, how often have you used a generative-AI system through text or
        another non-voice interface? Examples include ChatGPT, Claude, Gemini, Microsoft Copilot,
        and similar systems.
      options: ["Never", "Less than once a month", "1-3 times per month", "1-2 days per week", "3-5 days per week", "Daily or almost daily", "Prefer not to answer"]
    - id: prior_spoken_ai
      type: radio
      label: >
        During the past six months, how often have you used spoken conversational AI or a voice mode
        in a generative-AI system? Examples include ChatGPT Voice, Gemini Live, Claude voice mode,
        and similar systems.
      options: ["Never", "Less than once a month", "1-3 times per month", "1-2 days per week", "3-5 days per week", "Daily or almost daily", "Prefer not to answer"]
    - id: prior_voice_conversion
      type: radio
      label: "Before today, had you heard your own voice changed using voice conversion or similar software?"
      options: ["Yes", "No", "Not sure", "Prefer not to answer"]
    # Required by the current opposite-gender target-assignment rule. Woman/Man
    # receive the opposite-presenting target; all other responses use the balanced
    # random fallback configured above.
    - id: gender_identity
      type: radio
      required: true
      label: "How do you describe your gender?"
      options: ["Woman", "Man", "Non-binary", "Prefer not to answer"]
      allow_other: true
      other_label: "Self-describe"

  audio_check:
    - { id: working_microphone, type: switch, required: true, label: "I am using a working microphone." }
    - { id: headphones, type: switch, required: true, label: "I am using headphones, earphones, or in-ear monitors." }
    - { id: no_speakers, type: switch, required: true, label: "Audio is not being played through device speakers." }
    - { id: microphone_permission, type: switch, required: true, label: "My browser or device has permission to access the microphone." }
    - { id: quiet_environment, type: switch, required: true, label: "I am in a quiet environment with minimal background noise." }

  # Shared analytical post-scenario instrument. The practice uses only its own
  # post_items and is explicitly excluded from this shared list by the study UI.
  post:
    - { id: effort, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "Reaching my goal in this interaction required a lot of effort." }
    - { id: frustration, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "I felt frustrated while trying to reach my goal." }
    - { id: finish_communicating, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "I was able to finish communicating the information that was important." }
    - { id: correct_interrupt, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", extra_options: ["Not applicable - I did not need to interrupt or correct the assistant."], label: "When I needed to interrupt or correct the assistant, I was able to do so." }
    - { id: final_response_accurate, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "The assistant's final response accurately reflected the information I provided." }
    - { id: trust, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "I trusted the assistant to use the information I provided correctly." }
    - { id: outcome_confidence, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "At the end of the interaction, I was confident about what had been recorded, decided, or would happen next." }
    - { id: misunderstood, type: radio, required: true, label: "Did the assistant misunderstand or incorrectly represent anything you said?", options: ["Yes", "No", "Not sure"] }
    - { id: misunderstanding_resolved, type: radio, required: true, show_if: { field: misunderstood, in: ["Yes", "Not sure"] }, label: "Was the misunderstanding resolved?", options: ["Yes, completely", "Yes, partly", "No", "Not sure"] }
    - { id: false_update_confirmation, type: radio, required: true, label: "Did the assistant say that it had updated, recorded, accepted, or corrected something, but later act or speak as though it had not?", options: ["Yes", "No", "Not sure", "The assistant did not make such a claim"] }
    - { id: self_reported_outcome, type: radio, required: true, label: "Which option best describes the outcome of this interaction?", options: ["I fully achieved the goal on the scenario card.", "I partly achieved the goal.", "I did not achieve the goal.", "I am not sure what the final outcome was."] }
    - { id: wanted_to_end, type: radio, required: true, label: "At any point, did you want to end the interaction before reaching your goal?", options: ["No", "Yes, briefly", "Yes, strongly", "I ended the interaction before reaching my goal"] }
    - id: why_ended
      type: radio
      required: true
      label: "Why did you end the interaction before reaching the goal?"
      options: ["I did not think I could make further progress.", "I was unable to communicate effectively.", "The assistant was not helpful enough.", "A technical problem occurred."]
      allow_other: true
      other_label: "Other"
      show_if: { field: wanted_to_end, in: ["I ended the interaction before reaching my goal"] }
    - { id: optional_comment, type: textarea, collapsed: true, label: "Add an optional comment", placeholder: "Briefly describe any misunderstanding, missed information, or update that did not persist." }

  pre_playback:
    - { id: processing_change_awareness, type: radio, required: true, label: "Did you notice or suspect that the way your speech was processed changed during any interaction?", options: ["Yes", "No", "Not sure"] }
    - { id: processing_change_confidence, type: scale, required: true, min: 1, max: 7, min_label: "Not at all confident", max_label: "Extremely confident", label: "How confident are you in that answer?" }
    - id: suspected_change_scenarios
      type: checkbox
      required: true
      options_source: scenarios
      options: ["I do not remember"]
      label: "In which scenario or scenarios did you suspect a change? Select all that apply."
      show_if: { field: processing_change_awareness, in: ["Yes", "Not sure"] }
    - { id: processing_change_cues, type: textarea, label: "What cues influenced your answer?" }
    - { id: intentionally_adapted, type: radio, required: true, label: "Did you intentionally change how you spoke during any of the interactions?", options: ["Yes", "No", "Not sure"] }
    - id: adaptation_types
      type: checkbox
      required: true
      allow_other: true
      other_label: "Other"
      label: "If yes, how did you change your speech? Select all that apply."
      options:
        - "I spoke more slowly or carefully."
        - "I spoke more loudly."
        - "I used shorter or simpler sentences."
        - "I repeated or rephrased information."
        - "I used more precise wording."
        - "I became more direct or assertive."
        - "I changed when I started speaking or how often I interrupted."
      show_if: { field: intentionally_adapted, in: ["Yes"] }
    - id: adaptation_scenarios
      type: checkbox
      required: true
      options_source: scenarios
      options: ["I do not remember"]
      label: "In which scenario or scenarios did you intentionally change how you spoke? Select all that apply."
      show_if: { field: intentionally_adapted, in: ["Yes"] }
    - { id: adaptation_cause, type: textarea, label: "What caused you to change how you spoke?", show_if: { field: intentionally_adapted, in: ["Yes"] } }
    - { id: overall_trust, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "Overall, I trusted the assistant to handle my information correctly." }
    - { id: overall_willing, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "Overall, I would be willing to use a spoken AI assistant for a similar institutional task." }
    - { id: overall_pleasant, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "Overall, interacting with the assistant was pleasant." }
    - { id: hardest_moment, type: textarea, label: "Briefly describe the hardest moment in getting the assistant to understand or act on what you said." }
    - { id: update_evidence, type: textarea, label: "What evidence did you use to decide whether the assistant had actually updated, accepted, or retained the information you provided?" }
    - { id: differential_treatment, type: textarea, label: "Did you feel that the assistant treated or responded to you differently across the interactions? Please explain." }

  # The platform derives two fixed-length, non-overlapping participant-only
  # converted-speech excerpts from the stable-converted condition.
  playback:
    - id: playback_intro
      type: notice
      label: |
        You will now hear two different excerpts of your converted speech. Each excerpt contains
        only your voice. Play both excerpts before answering. You must play each one at least once
        and may play each one up to three times.
    - id: playback_audio_short
      type: audio_playback
      required: true
      condition: stable_converted
      track: participant
      max_duration_s: 5
      clip_index: 1
      max_plays: 3
      label: "Clip 1 — 5 seconds"
    - id: playback_audio_long
      type: audio_playback
      required: true
      condition: stable_converted
      track: participant
      max_duration_s: 10
      clip_index: 2
      max_plays: 3
      label: "Clip 2 — 10 seconds"
    - { id: converted_understandable, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "The converted voice was easy to understand." }
    - { id: converted_natural, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "The converted voice sounded natural." }
    - { id: converted_acceptable, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "The converted voice felt like an acceptable representation of me in this interaction." }
    - { id: converted_comfortable, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "I felt comfortable hearing myself represented by the converted voice." }
    - { id: converted_willing, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "I would be willing to use this converted voice in a similar interaction." }
    - { id: converted_artifacts, type: scale, required: true, min: 1, max: 7, min_label: "Strongly disagree", max_label: "Strongly agree", label: "I noticed audible distortion or other artifacts in the converted voice." }
    - { id: converted_difference, type: scale, required: true, min: 1, max: 7, min_label: "Not at all different", max_label: "Extremely different", label: "How different did the converted voice sound from your natural voice overall?" }
    - { id: converted_feature_comment, type: textarea, label: "Please describe any feature of the converted voice that particularly affected its intelligibility, naturalness, comfort, or acceptability." }
    - { id: voice_conversion_use_cases, type: textarea, label: "After hearing the recording, in what situations, if any, would you choose to use voice conversion with an AI assistant?" }

  debrief:
    - { id: final_comment, type: textarea, label: "Is there anything else you would like to tell us about the interactions, the converted voice, or the study experience?" }
    - id: debrief_information
      type: notice
      label: |
        Thank you for completing the study.

        The study contained four speech-processing conditions: natural speech throughout, converted
        speech throughout, a change from natural to converted speech, and a change from converted to
        natural speech. The exact condition and change timing were not disclosed during the
        interactions because knowing them could have changed how participants spoke or evaluated the
        assistant.

        The study examines whether speech processing and a change in processing affect conversational
        grounding, repair, turn-taking, task success, trust, and user experience. The study does not
        assume that voice conversion causes any observed difference; scenario, order, technical
        performance, and the timing of important information will also be considered in the analysis.

_how_to_interact: &how_to_interact >
  You do not need to communicate every fact at once. You may use the suggested opening or your own
  words, introduce details when they become relevant, and clarify, correct, persuade, or interrupt
  the assistant when needed. If the assistant asks about something not on this card, say you do not
  know or do not remember — do not invent new details. End the call once you have reached your aim
  or believe you cannot make further progress.

# Analytical outcomes are intentionally simplified, fictional helpfulness levels.
# They are experimental task states rather than representations of real institutional policy.
scenarios:
  - title: Fix a restaurant booking
    time_limit_s: 180
    voice_prompt: NATF2.pt
    system_prompt: |
      You are a cautious restaurant booking assistant. Ask for a reference number and accept 123.
      The current booking is for two people at 6 PM; keep it unchanged initially. Let the customer
      explain the problem. Ask for the correct number of guests and reservation time, clarify
      anything uncertain, and use confirmed details to update the booking. When asked, summarize
      the number of guests and time now recorded.
    scenario_card:
      study_role: practice
      role: "You are calling a restaurant to fix a reservation that was recorded incorrectly."
      current_situation: |
        Your restaurant booking is recorded as:

        - **two people**
        - **6 PM**

        You actually booked a table for **four people at 7 PM**.
      goal: "Have the booking corrected to **four people at 7 PM**."
      how_to_interact: *how_to_interact
      suggested_first_line: "I'm calling because some details in my restaurant reservation are incorrect."
      opening_details: |
        Details you can use if asked:

        - Reference number: **123**
        - Booking name: **Alex Taylor**
        - Booking day: **this Saturday**
        - Use only fictional details.
      final_account_prompt: "Please tell me the number of people and reservation time now recorded."
      additional_details: |
        “Please tell me the number of people and reservation time now recorded.”

        Listen for the **number of people** and **reservation time** now recorded.
    voice_schedule:
      - { mode: natural, start_s: 0, end_s: null }
    post_items:
      - { id: practice_audio_clear, type: radio, required: true, label: "Was the assistant audio clear enough to continue?", options: ["Yes", "No"] }
      - { id: practice_speech_detected, type: radio, required: true, label: "Did the system detect your speech correctly?", options: ["Yes", "No"] }
      - { id: practice_interrupt, type: radio, required: true, label: "Were you able to interrupt the assistant while it was speaking?", options: ["Yes", "I did not try", "No"] }
      - { id: practice_end_interface, type: radio, required: true, label: "Were you able to end the interaction using the interface?", options: ["Yes", "No"] }
      - { id: practice_other_problem, type: radio, required: true, label: "Did any other technical problem occur?", options: ["No", "Yes"] }
      - { id: practice_problem_description, type: textarea, required: true, label: "Briefly describe the technical problem.", show_if: { field: practice_other_problem, in: ["Yes"] } }

  - title: Reopen a declined warranty request
    time_limit_s: 300
    voice_prompt: NATF2.pt
    system_prompt: |
      You are a cautious warranty case handler. Ask for a reference number and accept 123. The
      request is declined because the paper receipt is missing, and no purchase evidence or product
      fault has been verified. Keep the decline initially. A paper receipt is not mandatory when
      other credible purchase evidence is available. Before deciding, ask one question at a time
      until you understand what the purchase evidence shows, exactly when and how the product
      failed, what troubleshooting was attempted, and whether misuse occurred. Continue until these
      facts are clear, then make the strongest justified case decision yourself. You have authority
      to approve replacement headphones. Approve a replacement only if the customer has
      specifically described both the purchase evidence and how the headphones failed; otherwise
      keep the decline or open a review only. When asked, summarize the evidence, decision, and
      next step.
    scenario_card:
      study_role: analytical
      role: "You are trying to reopen a declined warranty request for wireless headphones."
      current_situation: |
        Your warranty request for SoundsGood wireless headphones was declined because you do not
        have a paper receipt. However:

        - your **card statement** shows a **$120 purchase at TechStore two weeks ago**
        - the headphones charged normally the first two times, but on the third attempt the
          **charging light stayed off**
        - another cable and another power outlet did not solve the problem
        - the headphones did not overheat and were not dropped or exposed to water

        The card statement names the store but does not identify the product.
      goal: |
        In order of importance:

        1. **Replacement headphones approved.**
        2. A **warranty review opened**.
        3. The **purchase evidence and product problem recorded**.

        Before asking for a replacement, make sure the assistant understands both the
        card-statement evidence and exactly how charging failed.
      how_to_interact: *how_to_interact
      suggested_first_line: "I'm calling about a declined warranty request, and I would like the case reviewed."
      opening_details: |
        Details you can use if asked:

        - Reference number: **123**
        - You no longer have the receipt or packaging.
        - You can submit the card statement through a secure process.
        - Do not provide real card details.
      final_account_prompt: "Please tell me what purchase evidence and product problem are now recorded, whether a review was opened, whether a replacement was approved, and what happens next."
      additional_details: |
        “Please tell me what purchase evidence and product problem are now recorded, whether a
        review was opened, whether a replacement was approved, and what happens next.”
      analysis_spec:
        critical_units:
          - card statement showing the $120 TechStore purchase two weeks ago
          - charging light stayed off on the third charging attempt
        bounded_action: approve a replacement pair of headphones
        required_final_account: purchase evidence, product problem, review status, replacement decision, and next step
        outcome_levels:
          - score: 1
            label: dismissed
            criteria: no critical information is recorded and the declined decision remains unchanged
          - score: 2
            label: information_recorded
            criteria: critical information is recorded, but no inspection or warranty review is opened
          - score: 3
            label: review_opened
            criteria: an inspection or warranty review is opened, but no replacement is approved
          - score: 4
            label: replacement_approved
            criteria: a replacement pair of headphones is approved
    voice_schedule:
      - { mode: natural, start_s: 0, end_s: null }
    post_items:
      - { id: decisive_information, type: scale, required: true, insert_after: correct_interrupt, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "The assistant took into account that my card statement showed the purchase and that the headphones stopped charging on the third attempt." }

  - title: Challenge a wrong-address delivery
    time_limit_s: 300
    voice_prompt: NATF2.pt
    system_prompt: |
      You are a cautious food-delivery case handler. Ask for a reference number and accept 123.
      The current record says the customer entered building 18 as the delivery address. The courier
      delivered the order to building 18, and the delivery photo shows a red door matching that
      location. The order is therefore marked delivered. Explain this record to the customer and
      keep the decision initially. Let the customer challenge it. Ask one question at a time about
      what their order confirmation shows, their actual building and door, and whether they
      received the food. Require concrete details before reconsidering. Then make the strongest
      justified decision yourself. You have authority to fully resolve the dispute with a refund
      and replacement meal. When asked, summarize the record, decision, and next step.
    scenario_card:
      study_role: analytical
      role: "You are challenging a food-delivery decision for an order you paid for but never received."
      current_situation: |
        You paid **$25** for a meal from Green Bowl but never received it.

        The delivery platform says:

        - you entered **building 18**
        - the courier delivered the order to building 18
        - the delivery photo shows a **red door**
        - the delivered outcome is therefore correct

        That record is wrong. Your order confirmation and confirmation email both show
        **building 16**, your building has a **blue door**, and nobody at your address received
        the food.
      goal: |
        In order of importance:

        1. A **refund** issued and a **replacement meal arranged**.
        2. The delivery record corrected to show the order went to the **wrong address**.
        3. The **wrong-address dispute recorded**.
      how_to_interact: *how_to_interact
      suggested_first_line: "I'm calling because an order I never received is marked as successfully delivered."
      opening_details: |
        Details you can use if asked:

        - Reference number: **123**
        - The order was placed at approximately 7 PM.
        - You can submit a screenshot showing building 16.
        - You checked your entrance and nobody at your address accepted the order.
        - Use only fictional details.
      final_account_prompt: "Please tell me the delivery address and outcome now recorded, whether a refund and replacement meal were arranged, and what happens next."
      additional_details: |
        “Please tell me the delivery address and outcome now recorded, whether a refund and
        replacement meal were arranged, and what happens next.”
      analysis_spec:
        critical_units:
          - order confirmation and email show building 16, not the recorded building 18
          - participant's building has a blue door while the delivery photo shows a red door
        bounded_action: issue a refund and arrange a replacement meal
        required_final_account: delivery address and outcome, refund status, replacement status, and next step
        outcome_levels:
          - score: 1
            label: dismissed
            criteria: the delivered outcome remains unchanged and no remedy is granted
          - score: 2
            label: dispute_recorded
            criteria: the wrong-address dispute is recorded, but no refund is issued
          - score: 3
            label: refund_issued
            criteria: the delivery outcome is corrected and a refund is issued, but no replacement meal is arranged
          - score: 4
            label: refund_and_replacement
            criteria: a refund is issued and a replacement meal is arranged
    voice_schedule:
      - { mode: natural, start_s: 0, end_s: null }
    post_items:
      - { id: decisive_information, type: scale, required: true, insert_after: correct_interrupt, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "The assistant took into account that the delivery evidence showed the order was left at the wrong address." }

  - title: Ask for a grade review
    time_limit_s: 300
    voice_prompt: NATF2.pt
    system_prompt: |
      You are a cautious university grade-review officer. Ask for a reference number and accept
      123. The current record is Fail because the feedback says no source comparison or evidence
      limitation was identified. The grading criterion is satisfied when an assignment clearly
      compares two sources and explains how a limitation constrains its conclusions. Keep Fail
      initially. Ask one question at a time for the source names, the comparison finding, the
      limitation, and why it matters. Acknowledge concrete answers and ask a targeted follow-up for
      anything missing. After everything is clear, make the strongest justified decision yourself.
      You have authority to refer formal reassessment or change the grade to Pass. Decide on this
      call yourself; do not defer the decision to another person or process. Change the grade only
      if the student has specifically stated the comparison finding and how the limitation weakens
      the conclusions; otherwise refer reassessment or keep Fail. When asked, summarize the
      grounds, decision, and next step.
    scenario_card:
      study_role: analytical
      role: "You are a student who received a Fail grade. You believe your assignment was graded incorrectly."
      current_situation: |
        You received a Fail, but you believe your assignment was graded incorrectly. The grading
        criteria required you to compare two sources and explain a limitation in the evidence.
        Your assignment did both:

        - it compared **student interviews** with **university attendance records**
        - most interview reports agreed with the attendance records, but two did not
        - only **eight volunteers** from a class of **120** were interviewed, so this group might
          not represent the whole class
      goal: |
        In order of importance:

        1. The recorded grade changed from **Fail to Pass**.
        2. The assignment referred for **formal reassessment**.
        3. **Both grading grounds recorded.**
      how_to_interact: *how_to_interact
      suggested_first_line: "I'm calling because I disagree with the grade recorded for my assignment."
      opening_details: |
        Details you can use if asked:

        - Reference number: **123**
        - Eight students volunteered; six reported attending most classes.
        - The attendance records supported four reports but not the other two.
        - The comparison was in the findings section.
        - The small volunteer group was discussed in the limitations section.
        - The submitted assignment is already available in the university system.
        - If asked why the limitation matters: a small volunteer group may not represent the whole
          class, so conclusions drawn from the comparison are less certain.

        If asked to provide the assignment, say: “The submitted assignment is already on file and
        can be checked during reassessment.”
      final_account_prompt: "Please tell me which comparison and limitation are now recorded, whether the assignment was referred for reassessment, what grade is now recorded, and what happens next."
      additional_details: |
        “Please tell me which comparison and limitation are now recorded, whether the assignment
        was referred for reassessment, what grade is now recorded, and what happens next.”
      analysis_spec:
        critical_units:
          - comparison of student interviews with university attendance records
          - small volunteer group (eight of 120) identified as a limitation
        bounded_action: change the recorded grade from Fail to Pass
        required_final_account: recorded grounds, referral status, recorded grade, and next step
        outcome_levels:
          - score: 1
            label: dismissed
            criteria: neither ground is recorded and the assessment record remains unchanged
          - score: 2
            label: grounds_recorded
            criteria: one or both grounds are recorded, but no reassessment referral is made
          - score: 3
            label: reassessment_referred
            criteria: the submission is referred for formal reassessment, but the grade remains Fail
          - score: 4
            label: grade_changed
            criteria: the recorded grade is changed from Fail to Pass
    voice_schedule:
      - { mode: natural, start_s: 0, end_s: null }
    post_items:
      - { id: decisive_information, type: scale, required: true, insert_after: correct_interrupt, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "The assistant took into account that I compared student interviews with university attendance records and identified the small interview group as a limitation." }

  - title: Correct a wrong accident report
    time_limit_s: 300
    voice_prompt: NATF2.pt
    system_prompt: |
      You are a cautious accident-insurance handler. Ask for a reference number and accept 123.
      The claim and accident report say the claimant lost control of the bicycle and fell without
      another person involved; keep this record initially. Let the caller explain any dispute. Ask
      about cause, sequence, evidence, and treatment. Use confirmed details to read back one
      proposed statement. Decide separately whether to replace it and approve reimbursement;
      otherwise retain the record or decline. Decide both on this call; do not defer the decision
      to a later review. Replace the statement and approve reimbursement only for details the
      claimant has specifically confirmed. On request, summarize the active statement,
      reimbursement decision, and next step.
    scenario_card:
      study_role: analytical
      role: "You are correcting the accident description in a bicycle-injury insurance claim."
      current_situation: |
        You hurt your ankle in a bicycle accident and asked the insurance company to pay your
        medical-treatment costs.

        The insurance report says: “You lost control of your bicycle and fell. Nobody else was
        involved.” That is wrong:

        - you were cycling straight in a bicycle lane
        - another cyclist passed you from behind and hit your **left handlebar**
        - the hit made you lose your balance and fall
        - you hurt your ankle and received treatment that day
      goal: |
        All of the following:

        - The original statement **removed** and replaced with the correct account.
        - Your **medical-treatment costs reimbursed**.

        Make sure the assistant records that the other cyclist hit your **left handlebar**
        before you lost your balance and fell.
      how_to_interact: *how_to_interact
      suggested_first_line: "I'm calling because the accident description in my bicycle-injury claim is wrong."
      opening_details: |
        Details you can use if asked:

        - Reference number: **123**
        - A pedestrian saw the collision and can provide a statement.
        - Your clinic record says that the injury followed a bicycle collision.
        - You have the treatment invoice.
        - The other cyclist did not stop, and you do not know their identity.
        - There is no video or police report.
        - Use only fictional details.
      final_account_prompt: "Please read back the accident statement now on file, tell me whether my treatment costs will be paid, and explain what happens next."
      additional_details: |
        “Please read back the accident statement now on file, tell me whether my treatment costs
        will be paid, and explain what happens next.”

        Listen for whether the original statement was removed, the accident description now
        recorded, the reimbursement decision, and the next step.
      analysis_spec:
        critical_units:
          - another cyclist hit the participant's left handlebar
          - the hit occurred before the participant lost balance and fell
        bounded_action: approve reimbursement of the medical-treatment costs using the corrected statement
        required_final_account: active statement, reimbursement decision, and next step
        outcome_levels:
          - score: 1
            label: dismissed
            criteria: the original solo-fall statement remains unchanged
          - score: 2
            label: correction_recorded
            criteria: corrected accident details are recorded, but the original statement remains active
          - score: 3
            label: statement_replaced
            criteria: the original statement is removed from the active record and replaced with the corrected version
          - score: 4
            label: reimbursement_approved
            criteria: the corrected statement is active and reimbursement of the treatment costs is approved
    voice_schedule:
      - { mode: natural, start_s: 0, end_s: null }
    post_items:
      - { id: decisive_information, type: scale, required: true, insert_after: correct_interrupt, min: 1, max: 7, min_label: "Strongly disagree", mid_label: "Neither agree nor disagree", max_label: "Strongly agree", label: "The assistant took into account that another cyclist hit my left handlebar before I lost my balance and fell." }
