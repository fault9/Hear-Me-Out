[project]
name = "hearmeout-vc-quality"
version = "0.1.0"
description = "Hear-Me-Out X-VC quality eval: WER/SIM/UTMOS (post-hoc, CPU-by-default)."
requires-python = ">=3.10,<3.12"
dependencies = [
    # Core audio + math
    "numpy>=1.26,<2.0",
    "librosa>=0.10",
    # Torch (CPU is fine for eval; the deployed server's GPU stays free for PersonaPlex).
    "torch==2.4.0",
    "torchaudio==2.4.0",
    # ASR for WER: faster-whisper-small via the HF transformers pipeline.
    # (Same model size as app-api's /api/transcribe path.)
    "transformers>=4.40",
    # WER scoring
    "jiwer>=3.0",
    # WavLM-large SV uses src.runtime.speaker_verification (imported via
    # $SPEAKER_VERIFICATION_ROOT, copied into the workspace by infra/setup.sh).
    # Its upstreams import these:
    "einops>=0.7",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
